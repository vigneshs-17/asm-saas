<section class="surface-panel">
  <div class="surface-panel-header">
    <h2 class="panel-title">Create your organization</h2>
    <p class="panel-subtitle">You are not a member of any organization yet. Create an organization to begin monitoring.</p>
  </div>
  <form id="create-org-form">
    <div class="form-group">
      <label for="org-name" class="form-label">Organization name</label>
      <input type="text" id="org-name" name="name" class="form-input" placeholder="e.g. Acme Corporation" required maxlength="100">
    </div>
    <button type="submit" class="btn btn-primary">Create organization</button>
  </form>
</section>
